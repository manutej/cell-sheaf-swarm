name: swarm-worker

on:
  workflow_dispatch:
    inputs:
      agentId:
        description: Agent id
        required: true
        type: string
      edgeId:
        description: Restriction edge id
        required: false
        type: string
      task:
        description: Task label
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Echo worker receipt
        run: |
          echo "agent=${{ inputs.agentId }} edge=${{ inputs.edgeId }} task=${{ inputs.task }}"
          node scripts/pulse-run.mjs --graph contracts/swarm.sheaf.json --ticks 1 || true
